<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Trendora</title>
  <meta name="description"
    content="Register an account with Trendora. and get 20% off your first order. Fashion for a Better You - curated luxury and modern apparel." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>

  <!-- Top Announcement Bar -->
  <div class="announcement-bar" id="announcement-bar">
    <div class="inner">
      <p>Sign up and get 20% off to your first order. <a href="register.html">Sign Up Now</a></p>
      <button class="close-btn" id="close-announcement" aria-label="Close Announcement">&times;</button>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container header-container">
      <div class="header-left">
        <a href="index.html" class="brand-logo">Trendora</a>
      </div>
      <nav class="main-nav">
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="shop.html?filter=sale" class="nav-link">On Sale</a>
        <a href="shop.html?filter=new" class="nav-link">New Arrivals</a>
        <a href="index.html#brands-section" class="nav-link">Brands</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="action-btn" aria-label="Shopping Cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-page-container">
      <div class="auth-header">
        <h1 class="auth-title">CREATE ACCOUNT</h1>
        <p class="auth-subtitle">Sign up now and unlock 20% discount on your first order</p>
      </div>

      <form class="auth-form" id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="form-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,0.4)">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
            <input type="text" id="reg-name" placeholder="John Doe" required />
          </div>
          <div class="field-error-msg" id="reg-name-err"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="form-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,0.4)">
              <path
                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
            <input type="email" id="reg-email" placeholder="name@example.com" required />
          </div>
          <div class="field-error-msg" id="reg-email-err"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="form-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,0.4)">
              <path
                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
            </svg>
            <input type="password" id="reg-password" placeholder="At least 6 characters" required />
            <button type="button" class="toggle-pwd-btn" data-target="reg-password"
              aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="reg-pwd-err"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="form-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,0.4)">
              <path
                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
            </svg>
            <input type="password" id="reg-confirm-password" placeholder="Re-enter password" required />
          </div>
          <div class="field-error-msg" id="reg-confirm-err"></div>
        </div>

        <div class="field-error-msg" id="reg-server-err" style="text-align: center; margin-bottom: 12px; font-weight: 600;"></div>

        <button type="submit" class="btn-primary btn-auth-submit" id="btn-reg-submit">Create Account</button>

        <p class="auth-switch-text">
          Already have an account? <a href="login.html">Sign In</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" style="padding-top: 60px;">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <p class="copyright">Trendora &copy; 2000-2023, All Rights Reserved</p>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
